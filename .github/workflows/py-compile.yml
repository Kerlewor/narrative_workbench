name: Python Syntax Check

on:
  push:
  pull_request:

jobs:
  py-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m py_compile scripts/*.py

  doctor:
    runs-on: ubuntu-latest
    needs: py-compile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/doctor.py

  gatekeeper-smoke:
    runs-on: ubuntu-latest
    needs: py-compile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/gatekeeper.py --chapter 1 --stage final || true
